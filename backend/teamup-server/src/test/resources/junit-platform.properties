# JUnit Platform Configuration for jqwik
# Property-based testing configuration for team navigation performance optimization

# Minimum 100 iterations for all property tests as per design requirements
jqwik.tries.default = 100

# Enable detailed reporting
jqwik.reporting.usejunitplatform = true

# Maximum discard ratio (how many generated values can be discarded before giving up)
jqwik.maxdiscardratio = 5

# Shrinking configuration
jqwik.shrinking.bounded = 1000

# Edge cases mode (include edge cases in generation)
jqwik.edgecases.mode = MIXIN

# Generation mode
jqwik.generation.mode = AUTO

# JUnit Platform configuration
junit.jupiter.execution.parallel.enabled = false
junit.jupiter.execution.parallel.mode.default = same_thread
