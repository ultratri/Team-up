server:
  port: 8080
  servlet:
    context-path: /api

file:
  # 使用绝对路径默认值，避免 Windows 下相对路径落到 Tomcat 临时目录导致上传失败
  upload:
    path: ${TEAMUP_UPLOAD_PATH:${user.home}/teamup/uploads}
  access:
    url: http://localhost:8080/api/uploads

spring:
  application:
    name: teamup-server
  main:
    allow-circular-references: true
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
        enabled: false
  
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/team_matching?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: 123456
    hikari:
      minimum-idle: 2
      maximum-pool-size: 10
      connection-timeout: 10000
      idle-timeout: 300000
      max-lifetime: 600000
      connection-test-query: SELECT 1
  
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      timeout: 3000
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: -1
    mongodb:
      uri: "mongodb://localhost:27017/teamup"
  elasticsearch:
    uris: http://localhost:9200
    connection-timeout: 5s
    socket-timeout: 30s

mybatis-plus:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.teamup.server.modules.*.entity
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# JWT配置
jwt:
  secret: teamup-secret-key-for-jwt-token-generation-2024
  expiration: 86400000  # 24小时（毫秒）
  header: Authorization
  prefix: "Bearer "

logging:
  level:
    root: info
    com.teamup.server: info
    org.springframework.web: info
    org.apache.catalina: warn
    org.apache.tomcat: warn
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{50} - %msg%n"

socketio:
  host: "0.0.0.0"
  port: 9092

matching-service:
  url: "http://localhost:8000"
