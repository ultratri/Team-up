<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>认证状态检查</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            background: #f5f5f5;
        }
        .card {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        h2 {
            margin-top: 0;
            color: #333;
        }
        .status {
            padding: 10px;
            border-radius: 4px;
            margin: 10px 0;
        }
        .success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        .info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }
        pre {
            background: #f8f9fa;
            padding: 10px;
            border-radius: 4px;
            overflow-x: auto;
        }
        button {
            background: #007bff;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            margin-right: 10px;
        }
        button:hover {
            background: #0056b3;
        }
        .danger {
            background: #dc3545;
        }
        .danger:hover {
            background: #c82333;
        }
    </style>
</head>
<body>
    <div class="card">
        <h2>🔐 认证状态检查</h2>
        <div id="auth-status"></div>
    </div>

    <div class="card">
        <h2>📦 LocalStorage 数据</h2>
        <div id="storage-data"></div>
    </div>

    <div class="card">
        <h2>🧪 API 测试</h2>
        <button onclick="testAPI()">测试导师申请API</button>
        <button onclick="testMentorListAPI()">测试导师列表API</button>
        <button onclick="clearStorage()" class="danger">清除存储</button>
        <div id="api-result" style="margin-top: 20px;"></div>
    </div>

    <script>
        // 检查认证状态
        function checkAuthStatus() {
            const token = localStorage.getItem('token') || sessionStorage.getItem('token');
            const userStr = localStorage.getItem('user') || sessionStorage.getItem('user');
            
            let html = '';
            
            if (token) {
                html += `<div class="status success">✅ Token 存在</div>`;
                html += `<pre>Token: ${token.substring(0, 50)}...</pre>`;
            } else {
                html += `<div class="status error">❌ Token 不存在</div>`;
            }
            
            if (userStr) {
                try {
                    const user = JSON.parse(userStr);
                    html += `<div class="status success">✅ 用户信息存在</div>`;
                    html += `<pre>${JSON.stringify(user, null, 2)}</pre>`;
                    
                    if (user.roles && user.roles.includes('PLATFORM_ADMIN')) {
                        html += `<div class="status success">✅ 有 PLATFORM_ADMIN 角色</div>`;
                    } else {
                        html += `<div class="status error">❌ 没有 PLATFORM_ADMIN 角色</div>`;
                        html += `<div class="status info">当前角色: ${user.roles ? user.roles.join(', ') : '无'}</div>`;
                    }
                } catch (e) {
                    html += `<div class="status error">❌ 用户信息解析失败: ${e.message}</div>`;
                }
            } else {
                html += `<div class="status error">❌ 用户信息不存在</div>`;
            }
            
            document.getElementById('auth-status').innerHTML = html;
        }

        // 显示存储数据
        function showStorageData() {
            const data = {
                localStorage: {},
                sessionStorage: {}
            };
            
            for (let i = 0; i < localStorage.length; i++) {
                const key = localStorage.key(i);
                data.localStorage[key] = localStorage.getItem(key);
            }
            
            for (let i = 0; i < sessionStorage.length; i++) {
                const key = sessionStorage.key(i);
                data.sessionStorage[key] = sessionStorage.getItem(key);
            }
            
            document.getElementById('storage-data').innerHTML = `<pre>${JSON.stringify(data, null, 2)}</pre>`;
        }

        // 测试API
        async function testAPI() {
            const resultDiv = document.getElementById('api-result');
            resultDiv.innerHTML = '<div class="status info">⏳ 正在测试...</div>';
            
            const token = localStorage.getItem('token') || sessionStorage.getItem('token');
            
            if (!token) {
                resultDiv.innerHTML = '<div class="status error">❌ 没有 Token，无法测试</div>';
                return;
            }
            
            try {
                const response = await fetch('http://localhost:8080/api/admin/mentors/applications?page=1&size=10', {
                    method: 'GET',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    }
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    resultDiv.innerHTML = `
                        <div class="status success">✅ API 调用成功</div>
                        <pre>${JSON.stringify(data, null, 2)}</pre>
                    `;
                } else {
                    resultDiv.innerHTML = `
                        <div class="status error">❌ API 调用失败 (${response.status})</div>
                        <pre>${JSON.stringify(data, null, 2)}</pre>
                    `;
                }
            } catch (error) {
                resultDiv.innerHTML = `
                    <div class="status error">❌ 请求失败: ${error.message}</div>
                `;
            }
        }

        // 测试导师列表API
        async function testMentorListAPI() {
            const resultDiv = document.getElementById('api-result');
            resultDiv.innerHTML = '<div class="status info">⏳ 正在测试...</div>';
            
            const token = localStorage.getItem('token') || sessionStorage.getItem('token');
            
            if (!token) {
                resultDiv.innerHTML = '<div class="status error">❌ 没有 Token，无法测试</div>';
                return;
            }
            
            try {
                const response = await fetch('http://localhost:8080/api/admin/mentors?page=1&size=10', {
                    method: 'GET',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    }
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    resultDiv.innerHTML = `
                        <div class="status success">✅ API 调用成功</div>
                        <pre>${JSON.stringify(data, null, 2)}</pre>
                    `;
                } else {
                    resultDiv.innerHTML = `
                        <div class="status error">❌ API 调用失败 (${response.status})</div>
                        <pre>${JSON.stringify(data, null, 2)}</pre>
                    `;
                }
            } catch (error) {
                resultDiv.innerHTML = `
                    <div class="status error">❌ 请求失败: ${error.message}</div>
                `;
            }
        }

        // 清除存储
        function clearStorage() {
            if (confirm('确定要清除所有存储数据吗？这将退出登录。')) {
                localStorage.clear();
                sessionStorage.clear();
                alert('存储已清除，请重新登录');
                location.reload();
            }
        }

        // 页面加载时执行
        checkAuthStatus();
        showStorageData();
    </script>
</body>
</html>
