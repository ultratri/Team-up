<!DOCTYPE html>
<html>
<head>
    <title>认证调试</title>
    <style>
        body { font-family: monospace; padding: 20px; background: #1e1e1e; color: #d4d4d4; }
        .section { margin: 20px 0; padding: 15px; background: #252526; border-left: 3px solid #007acc; }
        .success { color: #4ec9b0; }
        .error { color: #f48771; }
        .warning { color: #dcdcaa; }
        pre { background: #1e1e1e; padding: 10px; overflow-x: auto; }
        button { background: #007acc; color: white; border: none; padding: 10px 20px; margin: 5px; cursor: pointer; }
        button:hover { background: #005a9e; }
    </style>
</head>
<body>
    <h1>🔍 认证状态实时调试</h1>
    
    <div class="section">
        <h2>📦 LocalStorage</h2>
        <div id="localStorage"></div>
    </div>
    
    <div class="section">
        <h2>🧪 API测试</h2>
        <button onclick="testAPI()">测试导师申请API</button>
        <button onclick="testWithManualToken()">使用手动Token测试</button>
        <div id="apiResult"></div>
    </div>
    
    <div class="section">
        <h2>🛠️ 操作</h2>
        <button onclick="clearAndReload()">清除缓存并刷新</button>
        <button onclick="copyToken()">复制Token</button>
    </div>

    <script>
        function showStorage() {
            const token = localStorage.getItem('token') || sessionStorage.getItem('token');
            const user = localStorage.getItem('user') || sessionStorage.getItem('user');
            
            let html = '';
            
            if (token) {
                html += `<div class="success">✅ Token: ${token.substring(0, 50)}...</div>`;
            } else {
                html += `<div class="error">❌ Token不存在</div>`;
            }
            
            if (user) {
                try {
                    const userObj = JSON.parse(user);
                    html += `<div class="success">✅ User: ${userObj.username}</div>`;
                    html += `<div class="success">✅ Roles: ${userObj.roles?.join(', ')}</div>`;
                    html += `<pre>${JSON.stringify(userObj, null, 2)}</pre>`;
                } catch (e) {
                    html += `<div class="error">❌ User解析失败: ${e.message}</div>`;
                }
            } else {
                html += `<div class="error">❌ User不存在</div>`;
            }
            
            document.getElementById('localStorage').innerHTML = html;
        }
        
        async function testAPI() {
            const result = document.getElementById('apiResult');
            result.innerHTML = '<div class="warning">⏳ 测试中...</div>';
            
            const token = localStorage.getItem('token') || sessionStorage.getItem('token');
            
            if (!token) {
                result.innerHTML = '<div class="error">❌ 没有Token</div>';
                return;
            }
            
            try {
                console.log('发送请求，Token:', token.substring(0, 30) + '...');
                
                const response = await fetch('http://localhost:8080/api/admin/mentors/applications?page=1&size=20', {
                    method: 'GET',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    }
                });
                
                console.log('响应状态:', response.status);
                const data = await response.json();
                console.log('响应数据:', data);
                
                if (response.ok) {
                    result.innerHTML = `
                        <div class="success">✅ 成功 (${response.status})</div>
                        <pre>${JSON.stringify(data, null, 2)}</pre>
                    `;
                } else {
                    result.innerHTML = `
                        <div class="error">❌ 失败 (${response.status})</div>
                        <pre>${JSON.stringify(data, null, 2)}</pre>
                    `;
                }
            } catch (error) {
                console.error('请求错误:', error);
                result.innerHTML = `<div class="error">❌ 错误: ${error.message}</div>`;
            }
        }
        
        async function testWithManualToken() {
            const token = prompt('请输入Token (从localStorage复制):');
            if (!token) return;
            
            const result = document.getElementById('apiResult');
            result.innerHTML = '<div class="warning">⏳ 测试中...</div>';
            
            try {
                const response = await fetch('http://localhost:8080/api/admin/mentors/applications?page=1&size=20', {
                    method: 'GET',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    }
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    result.innerHTML = `
                        <div class="success">✅ 成功！Token有效</div>
                        <pre>${JSON.stringify(data, null, 2)}</pre>
                    `;
                } else {
                    result.innerHTML = `
                        <div class="error">❌ 失败 (${response.status})</div>
                        <pre>${JSON.stringify(data, null, 2)}</pre>
                    `;
                }
            } catch (error) {
                result.innerHTML = `<div class="error">❌ 错误: ${error.message}</div>`;
            }
        }
        
        function clearAndReload() {
            if (confirm('确定要清除所有缓存并刷新吗？')) {
                localStorage.clear();
                sessionStorage.clear();
                location.href = '/login';
            }
        }
        
        function copyToken() {
            const token = localStorage.getItem('token') || sessionStorage.getItem('token');
            if (token) {
                navigator.clipboard.writeText(token);
                alert('Token已复制到剪贴板');
            } else {
                alert('没有Token可复制');
            }
        }
        
        // 页面加载时显示
        showStorage();
        
        // 每秒更新一次
        setInterval(showStorage, 1000);
    </script>
</body>
</html>
